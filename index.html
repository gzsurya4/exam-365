/* ===================== DATABASE: MODE PRODUKSI (FIRESTORE) ===================== */
function createFirestoreDB(fs, db) {
  const { doc, getDoc, getDocFromServer, getDocs, setDoc, deleteDoc, collection, query, where, orderBy, limit, writeBatch, onSnapshot, serverTimestamp, Timestamp } = fs;
  const TK = ['mulai', 'selesai', 'waktuMulai', 'waktuSelesai', 'waktu'];
  const enc = d => { const o = {}; for (const k in d) { const v = d[k]; o[k] = v === SERVER ? serverTimestamp() : (TK.includes(k) && typeof v === 'number') ? Timestamp.fromMillis(v) : v; } return o; };
  const dec = (id, d) => { if (!d) return null; const o = { id }; for (const k in d) { const v = d[k]; o[k] = v && typeof v.toMillis === 'function' ? v.toMillis() : v; } return o; };
  const ref = (c, id) => doc(db, c, id);
  const one = async (c, id) => { const s = await getDoc(ref(c, id)); return s.exists() ? dec(s.id, s.data()) : null; };
  const all = async q => (await getDocs(q)).docs.map(d => dec(d.id, d.data()));
  const set = (c, id, d) => setDoc(ref(c, id), enc(d), { merge: true });
  const del = (c, id) => deleteDoc(ref(c, id));
  const watch = (c, id, cb) => onSnapshot(ref(c, id), s => cb(s.exists() ? dec(s.id, s.data()) : null), e => console.error(e));
  const byU = (c, u) => query(collection(db, c), where('ujianId', '==', u));
  const bulk = async (ops) => { for (let i = 0; i < ops.length; i += 400) { const b = writeBatch(db); ops.slice(i, i + 400).forEach(f => f(b)); await b.commit(); } };
  return {
    getPeserta: id => one('peserta', id), listPeserta: () => all(collection(db, 'peserta')), savePeserta: (id, d) => set('peserta', id, d),
    savePesertaMany: a => bulk(a.map(x => b => b.set(ref('peserta', x.id), enc(x.data), { merge: true }))), deletePeserta: id => del('peserta', id),
    listUjian: () => all(collection(db, 'ujian')), saveUjian: (id, d) => set('ujian', id, d),
    getUjianAdmin: id => one('ujian_admin', id), saveUjianAdmin: (id, d) => set('ujian_admin', id, d),
    deleteUjian: async id => { const ops = [b => b.delete(ref('ujian', id)), b => b.delete(ref('ujian_admin', id))]; for (const c of ['sesi', 'nilai', 'pelanggaran']) (await getDocs(byU(c, id))).docs.forEach(d => ops.push(b => b.delete(d.ref))); await bulk(ops); },
    getAkses: h => one('akses', h), saveAkses: (h, d) => set('akses', h, d), deleteAkses: h => del('akses', h),
    getSesi: (u, p) => one('sesi', u + '_' + p), saveSesi: (u, p, d) => set('sesi', u + '_' + p, d), deleteSesi: (u, p) => del('sesi', u + '_' + p),
    listSesi: u => all(byU('sesi', u)), watchSesi: (u, p, cb) => watch('sesi', u + '_' + p, cb),
    saveSesiLogin: async (p, dv) => { await set('sesiLogin', p, { deviceId: dv, waktu: SERVER }); const s = await getDocFromServer(ref('sesiLogin', p)); return s.data().waktu.toMillis(); },
    watchSesiLogin: (p, cb) => watch('sesiLogin', p, cb),
    getNilai: (u, p) => one('nilai', u + '_' + p), listNilai: u => all(byU('nilai', u)), saveNilai: (u, p, d) => set('nilai', u + '_' + p, d),
    saveNilaiMany: a => bulk(a.map(x => b => b.set(ref('nilai', x.ujianId + '_' + x.pesertaId), enc(x), { merge: true }))), deleteNilai: (u, p) => del('nilai', u + '_' + p),
    addPelanggaran: d => setDoc(doc(collection(db, 'pelanggaran')), enc(d)),
    listPelanggaran: async u => (await all(u ? query(collection(db, 'pelanggaran'), where('ujianId', '==', u), limit(500)) : query(collection(db, 'pelanggaran'), orderBy('waktu', 'desc'), limit(300)))).sort((a, b) => b.waktu - a.waktu),
    getPengaturan: async () => ({ ...CFG0, ...((await one('pengaturan', 'umum')) || {}) }), savePengaturan: d => set('pengaturan', 'umum', d)
  };
}
function createFirebaseAuth(au, auth) {
  return {
    onChange: cb => au.onAuthStateChanged(auth, cb),
    login: async (e, p) => { try { await au.signInWithEmailAndPassword(auth, e.trim(), p); } catch { throw new Error('Email atau password salah.'); } },

ACT.pImp = () => {
  const w = openModal('Impor Peserta dari CSV', `<p class="mu">Kolom: <b>nis, nama, kelas, password</b>. Jika password dikosongkan, sistem membuat password acak dan menyediakan file kartu login untuk diunduh. Peserta dengan NIS yang sudah ada akan diperbarui (password lama tetap jika dikosongkan).</p><input type="file" id="pif" accept=".csv,.txt"><div id="pio" class="mu" style="margin-top:10px"></div>`);
  $('#pif', w).onchange = async e => {
    const f = e.target.files[0]; if (!f) return; const out = $('#pio', w);
    try {
      let rows = parseCSV(await f.text()); if (!rows.length) throw new Error('File kosong.');
      const h = rows[0].map(x => x.trim().toLowerCase()); const hasH = h.some(x => /nis|nama|username/.test(x));
      const col = (re, d) => { const i = h.findIndex(x => re.test(x)); return hasH ? i : d; };
      const ci = { u: col(/nis|username/, 0), n: col(/nama/, 1), k: col(/kelas/, 2), p: col(/pass/, 3) };
      if (hasH) rows = rows.slice(1);
      const gen = [], list = [], seen = new Set();
      for (const r of rows) {
        const id = idFrom(r[ci.u]); const nama = (r[ci.n] || '').trim(); if (!id || !nama || seen.has(id)) continue; seen.add(id);
        const d = { username: id, nama, kelas: ci.k >= 0 ? (r[ci.k] || '').trim() : '' }; let pw = ci.p >= 0 ? (r[ci.p] || '').trim() : '';
        const exists = C.peserta.some(x => x.id === id);
        if (!pw && !exists) { pw = genPass(); gen.push([id, nama, d.kelas, pw]); }
        if (pw) d.passHash = await sha256(id + ':' + pw);
        list.push({ id, data: d });
      }
      if (!list.length) throw new Error('Tidak ada baris valid (butuh kolom NIS dan nama).');
      out.innerHTML = `<b>${list.length}</b> peserta siap diimpor.<div class="row end"><button class="btn pri" id="pgo">Impor sekarang</button></div>`;
      $('#pgo', w).onclick = async ev => { await busy(ev.target, async () => { try { await DB.savePesertaMany(list); await loadPeserta(true); drawPeserta(); w.remove(); toast(list.length + ' peserta diimpor.'); if (gen.length) download('kartu-login-peserta.csv', csvLine(['nis', 'nama', 'kelas', 'password']) + '\n' + gen.map(csvLine).join('\n')); } catch (x) { toast('Gagal impor: ' + x.message, 'er'); } }); };
    } catch (x) { out.innerHTML = `<span style="color:var(--er)">${esc(x.message)}</span>`; }
  };
};

ACT.nImp = () => {
  const w = openModal('Impor Nilai dari Excel / CSV', `<p class="mu">Unggah hasil ekspor Microsoft Forms (<b>Open in Excel</b> &rarr; .xlsx) atau file CSV. Pilih kolom NIS dan kolom skor, lalu impor.</p><input type="file" id="nff" accept=".xlsx,.xls,.csv,.txt"><div id="nio" style="margin-top:12px"></div>`, { wide: true });

    const head = rows[0].map(x => String(x).trim()), data = rows.slice(1);
    const detect = re => head.findIndex(h => re.test(h));
    const iN = detect(/nis|induk|username|npm|nomor peserta|no\.? ?peserta/i), iS = detect(/total points|total poin|skor|nilai|score|points|poin/i);
    const opts = sel => `<option value="-1">-- pilih kolom --</option>` + head.map((h, i) => `<option value="${i}" ${i === sel ? 'selected' : ''}>${esc(h || 'Kolom ' + (i + 1))}</option>`).join('');
    out.innerHTML = `<div class="two"><label class="form"><span style="font-weight:600;font-size:13px">Kolom NIS / Username</span><select class="inp" id="cn" style="width:100%">${opts(iN)}</select></label><label class="form"><span style="font-weight:600;font-size:13px">Kolom skor</span><select class="inp" id="cs" style="width:100%">${opts(iS)}</select></label></div><label class="form" style="margin-top:10px"><span style="font-weight:600;font-size:13px">Jika satu NIS muncul lebih dari sekali</span><select class="inp" id="cm" style="width:100%"><option value="max">Ambil skor tertinggi</option><option value="first">Ambil pengiriman pertama</option><option value="last">Ambil pengiriman terakhir</option></select></label><div id="csum" style="margin:12px 0"></div><div class="row end"><button class="btn pri" id="cgo" disabled>Impor nilai</button></div>`;

      const a = +$('#cn', w).value, b = +$('#cs', w).value, m = $('#cm', w).value; const sum = $('#csum', w), go = $('#cgo', w);
      if (a < 0 || b < 0) { sum.innerHTML = '<span class="mu">Pilih kolom NIS dan kolom skor.</span>'; go.disabled = true; return; }
      const map = new Map(); let invalid = 0, dup = 0;
      for (const r of data) { const id = idFrom(String(r[a]).trim().replace(/\.0+$/, '')), sk = parseFloat(String(r[b]).replace(',', '.')); if (!id || isNaN(sk)) { invalid++; continue; }

      const known = new Set(C.peserta.map(p => p.id)), miss = [...map.keys()].filter(k => !known.has(k));
      ready = [...map.entries()].filter(([k]) => known.has(k)).map(([k, v]) => ({ ujianId: S.nu, pesertaId: k, skor: v, sumber: 'impor' }));
      sum.innerHTML = `<b>${ready.length}</b> nilai siap diimpor. ${dup ? `${dup} baris duplikat diproses. ` : ''}${invalid ? `${invalid} baris dilewati (NIS/skor tidak valid). ` : ''}${miss.length ? `<br><span style="color:var(--wa)">${miss.length} NIS tidak ditemukan di data peserta: ${esc(miss.slice(0, 8).join(', '))}${miss.length > 8 ? ', ...' : ''}</span>` : ''}`;
      go.disabled = !ready.length;
    };
    ['cn', 'cs', 'cm'].forEach(i => $('#' + i, w).onchange = calc); calc();
    $('#cgo', w).onclick = async ev => { await busy(ev.target, async () => { try { await DB.saveNilaiMany(ready); w.remove(); toast(ready.length + ' nilai diimpor.'); loadNilai(); } catch (x) { toast('Gagal impor: ' + x.message, 'er'); } }); };
  };
};

PAGES.beranda = async () => {

PAGES.kerjakan = async () => {

PAGES.riwayat = async () => {

};

/* ===================== PESERTA: TOKEN & MESIN UJIAN (ANTI CURANG) ===================== */
ACT.exOpen = b => { const u = C.ujian.find(x => x.id === b.dataset.id); if (!u) return; tokenModal(u); };
function tokenModal(u) {
  const w = openModal('Masukkan Token', `<p class="mu">Masukkan token ujian <b>${esc(u.judul)}</b> yang diberikan pengawas.</p><form id="tf" class="form"><input class="tok" name="t" maxlength="12" autocomplete="off" autocapitalize="characters" required placeholder="TOKEN"><div class="err" id="te"></div><div class="row end"><button type="button" class="btn ghost" data-close>Batal</button><button class="btn pri">Verifikasi</button></div></form>`);
  $('#tf', w).onsubmit = async e => {
    e.preventDefault(); const t = new FormData(e.target).get('t').trim().toUpperCase().replace(/\s/g, ''); const er = $('#te', w);
    await busy(e.target.querySelector('.pri'), async () => {
      try { const n = srv(); if (!u.aktif || n < u.mulai || n > u.selesai) throw 0; const a = await DB.getAkses(await sha256(u.id + ':' + t)); if (!a || a.ujianId !== u.id || !a.formUrl) throw 0; w.remove(); beginExam(u, a.formUrl); }
      catch { er.textContent = 'Token salah, atau ujian belum/tidak dibuka.'; }
    });
  };
}
async function beginExam(u, formUrl) {
  let sesi; try { sesi = await DB.getSesi(u.id, S.user.id); } catch (x) { return toast('Gagal memuat sesi: ' + x.message, 'er'); }
  if (sesi && sesi.status === 'selesai') return toast('Anda sudah menyelesaikan ujian ini.', 'er');
  X = { u, formUrl, sesi, max: S.cfg.maxPelanggaran || 3, fs: !!S.cfg.wajibFullscreen && !!document.documentElement.requestFullscreen, started: false, locked: false, ended: false, lastV: 0, h: {} };
  $('#view').innerHTML = `<div class="exam"><header class="eh glass"><div><b>${esc(u.judul)}</b><small>${esc(u.mapel)} &bull; ${esc(S.user.nama)}</small></div><div class="row wrap gap"><span class="badge amber" id="ev">Pelanggaran 0/${X.max}</span><span class="timer" id="et">--:--</span><button class="btn pri sm" data-act="exFinish" id="efin">Saya sudah mengirim jawaban</button></div></header><div class="ebody"><iframe id="ef" title="Formulir ujian" allow="fullscreen" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals"></iframe><div id="eo"></div></div></div>`;
  updBadge(); showIntro();
}
const ov = (html, cls = '') => { const o = $('#eo'); if (o) o.innerHTML = `<div class="eov"><div class="ebox ${cls}">${html}</div></div>`; };
const ovHide = () => { const o = $('#eo'); if (o) o.innerHTML = ''; };
function updBadge() { const b = $('#ev'); if (!b || !X) return; const n = X.sesi?.pelanggaran || 0; b.textContent = `Pelanggaran ${n}/${X.max}`; b.className = 'badge ' + (n >= X.max ? 'red' : n ? 'amber' : 'green'); }
function showIntro() {
  const s = X.sesi;
  if (s && s.status === 'terkunci') { X.locked = true; return showLock(); }
  const rules = S.cfg.tataTertib.split('\n').filter(Boolean).map(x => `<li>${esc(x)}</li>`).join('');
  ov(`<h3>${s ? 'Lanjutkan ujian' : 'Siap memulai?'}</h3><p class="mu">${esc(X.u.judul)} &bull; Durasi ${X.u.durasiMenit} menit${s ? ' &bull; Waktu tetap berjalan sejak Anda pertama memulai' : ''}</p><ul>${rules}<li>Batas pelanggaran: <b>${X.max} kali</b>${X.fs ? '. Ujian wajib dikerjakan dalam layar penuh' : ''}.</li></ul>${s ? `<p>Pelanggaran saat ini: <b>${s.pelanggaran || 0}/${X.max}</b></p>` : ''}<div class="row end"><button class="btn ghost" data-act="exBack">Batal</button><button class="btn pri" data-act="exStart">${s ? 'Lanjutkan' : 'Mulai mengerjakan'}</button></div>`);
}
function showWarn(n, jenis) {
  ov(`<h3>Peringatan ${n}/${X.max}</h3><p>${esc(jenis)}. Pelanggaran ini telah dicatat.</p><p>Sisa kesempatan: <b>${X.max - n}</b>. Jika mencapai ${X.max} pelanggaran, ujian Anda akan terkunci.</p><div class="row end"><button class="btn pri" data-act="exResume">Kembali ke ujian</button></div>`, 'warn');
}
function showLock() {
  const f = $('#ef'); if (f) f.style.visibility = 'hidden';
  ov(`<h3>Ujian terkunci</h3><p>Anda mencapai batas ${X.max} pelanggaran. Ujian dikunci dan hanya dapat dibuka oleh pengawas.</p><p class="mu">Layar ini akan terbuka otomatis setelah pengawas membuka kunci.</p><div class="row end"><button class="btn" data-act="exBack">Keluar</button></div>`, 'lock');
}
ACT.exResume = async () => { if (X && X.fs && !document.fullscreenElement) { try { await document.documentElement.requestFullscreen(); } catch { } } const f = $('#ef'); if (f) f.style.visibility = ''; ovHide(); };
ACT.exStart = async b => {
  if (!X || X.started) return;
  await busy(b, async () => {
    if (X.fs) { try { await document.documentElement.requestFullscreen(); } catch { } X.fs = !!document.fullscreenElement; }
    try {
      if (!X.sesi) { await DB.saveSesi(X.u.id, S.user.id, { ujianId: X.u.id, pesertaId: S.user.id, nama: S.user.nama, kelas: S.user.kelas || '', status: 'berlangsung', waktuMulai: SERVER, pelanggaran: 0 }); X.sesi = await DB.getSesi(X.u.id, S.user.id); }
    } catch (x) { toast('Tidak dapat memulai ujian: ' + (x.message || x), 'er'); return; }
    if (!X.sesi) return toast('Sesi tidak dapat dibuat. Coba lagi.', 'er');
    X.end = Math.min(X.sesi.waktuMulai + X.u.durasiMenit * 60000, X.u.selesai);
    if (X.end <= srv()) return finishExam('Waktu ujian telah habis.');
    X.started = true; startMonitor(); updBadge(); ovHide();
    const f = $('#ef'); if (X.formUrl.startsWith('demo:')) f.srcdoc = '<body style="font-family:sans-serif;padding:24px"><h2>Formulir contoh (Microsoft Forms)</h2><p>Ini hanya tampilan contoh pada mode preview.</p><p>1. Berapa hasil 2 + 3?</p><label><input type="radio" name="a"> 4</label><br><label><input type="radio" name="a"> 5</label><br><label><input type="radio" name="a"> 6</label><br><br><button>Kirim</button></body>'; else f.src = X.formUrl;
  });
};
function startMonitor() {
  const h = X.h;
  h.vis = () => { if (document.hidden) violation('Berpindah tab atau aplikasi'); };
  h.blur = () => setTimeout(() => { if (!document.hasFocus()) violation('Meninggalkan jendela ujian'); }, 150);
  h.fs = () => { if (X && X.fs && !document.fullscreenElement) violation('Keluar dari layar penuh'); };
  h.key = e => { const k = (e.key || '').toLowerCase(), ctl = e.ctrlKey || e.metaKey;
    if (k === 'f12' || (ctl && e.shiftKey && ['i', 'j', 'c'].includes(k))) { e.preventDefault(); violation('Mencoba membuka alat pengembang'); }
    else if (ctl && ['c', 'v', 'x', 'p', 'u', 's', 'a'].includes(k)) e.preventDefault(); };
  h.keyup = e => { if (e.key === 'PrintScreen') { try { navigator.clipboard.writeText(' '); } catch { } } };
  h.blk = e => e.preventDefault();
  h.unl = e => { if (X && X.started && !X.ended) { e.preventDefault(); e.returnValue = ''; } };
  document.addEventListener('visibilitychange', h.vis); window.addEventListener('blur', h.blur); document.addEventListener('fullscreenchange', h.fs);
  document.addEventListener('keydown', h.key, true); document.addEventListener('keyup', h.keyup, true);
  ['contextmenu', 'copy', 'cut', 'paste', 'dragstart'].forEach(t => document.addEventListener(t, h.blk, true)); window.addEventListener('beforeunload', h.unl);
  X.unsub = DB.watchSesi(X.u.id, S.user.id, d => {
    if (!X || X.ended) return;
    if (!d) { toast('Sesi ujian direset oleh pengawas.', 'er'); cleanupExam(); go('kerjakan'); return; }
    X.sesi = d; updBadge();
    if (d.status === 'terkunci' && !X.locked) { X.locked = true; showLock(); }
    else if (d.status === 'berlangsung' && X.locked) { X.locked = false; ov('<h3>Kunci dibuka</h3><p>Pengawas telah membuka kunci ujian Anda. Pelanggaran direset. Silakan lanjutkan dan patuhi tata tertib.</p><div class="row end"><button class="btn pri" data-act="exResume">Lanjutkan ujian</button></div>', 'okb'); }
    else if (d.status === 'selesai') finishExam('Ujian ditandai selesai oleh pengawas.', true);
  });
  X.timer = setInterval(tick, 1000); tick();
}
function tick() {
  if (!X || X.ended) return; const left = (X.end - srv()) / 1000, t = $('#et');
  if (t) { t.textContent = mmss(left); t.style.color = left < 300 ? 'var(--er)' : ''; }
  if (left <= 0) finishExam('Waktu ujian telah habis. Jawaban yang sudah terkirim di formulir tetap tersimpan.');
}
async function violation(jenis) {
  if (!X || !X.started || X.ended || X.locked) return;
  const now = Date.now(); if (now - X.lastV < 2500) return; X.lastV = now;
  const n = (X.sesi.pelanggaran || 0) + 1, lock = n >= X.max; X.sesi.pelanggaran = n; if (lock) { X.locked = true; X.sesi.status = 'terkunci'; }
  updBadge(); lock ? showLock() : showWarn(n, jenis);
  try {
    await DB.saveSesi(X.u.id, S.user.id, lock ? { pelanggaran: n, status: 'terkunci' } : { pelanggaran: n });
    await DB.addPelanggaran({ ujianId: X.u.id, pesertaId: S.user.id, nama: S.user.nama, kelas: S.user.kelas || '', jenis, ke: n, waktu: SERVER });
  } catch (e) { console.error(e); }
}
ACT.exFinish = async () => { if (!X || X.locked || X.ended) return; if (!X.started) return; if (await confirmBox('Pastikan Anda sudah menekan tombol Kirim di formulir. Akhiri ujian sekarang?', 'Akhiri ujian')) finishExam('Terima kasih, ujian Anda telah dicatat selesai.'); };
async function finishExam(msg, remote) {
  if (!X || X.ended) return; X.ended = true; stopMonitor();
  if (!remote) { try { await DB.saveSesi(X.u.id, S.user.id, { status: 'selesai', waktuSelesai: SERVER }); } catch (e) { console.error(e); } }
  if (document.fullscreenElement) { try { await document.exitFullscreen(); } catch { } }
  const f = $('#ef'); if (f) { f.removeAttribute('src'); f.removeAttribute('srcdoc'); }
  ov(`<h3>Ujian selesai</h3><p>${esc(msg)}</p><div class="row end"><button class="btn pri" data-act="exBack">Kembali</button></div>`, 'okb');
}
function stopMonitor() {
  if (!X) return; const h = X.h;
  clearInterval(X.timer); X.unsub && X.unsub(); X.unsub = null;
  if (h.vis) { document.removeEventListener('visibilitychange', h.vis); window.removeEventListener('blur', h.blur); document.removeEventListener('fullscreenchange', h.fs); document.removeEventListener('keydown', h.key, true); document.removeEventListener('keyup', h.keyup, true); ['contextmenu', 'copy', 'cut', 'paste', 'dragstart'].forEach(t => document.removeEventListener(t, h.blk, true)); window.removeEventListener('beforeunload', h.unl); }
  X.h = {};
}
function cleanupExam() { if (!X) return; X.ended = true; stopMonitor(); if (document.fullscreenElement) { try { document.exitFullscreen(); } catch { } } X = null; }
ACT.exBack = () => { cleanupExam(); go('kerjakan'); };

/* ===================== PWA (1 FILE) ===================== */
function initPWA() {
  try {
    if (!('serviceWorker' in navigator)) return;
    const code = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));self.addEventListener('fetch',()=>{});";
    navigator.serviceWorker.register(URL.createObjectURL(new Blob([code], { type: 'text/javascript' }))).catch(() => { });
  } catch { }
}

/* ===================== BOOT ===================== */
async function boot() {
  initPWA(); $('#view').innerHTML = loading();
  try {
    if (IS_PREVIEW) { DB = await createMemoryDB(); AUTH = createMemoryAuth(); }
    else {
      if (!firebaseConfig.apiKey || firebaseConfig.apiKey === 'API_KEY_ANDA') { $('#view').innerHTML = '<div class="login"><div class="lc glass"><h3>Konfigurasi belum diisi</h3><p class="mu">Isi <b>firebaseConfig</b> di bagian atas kode, lalu muat ulang halaman.</p></div></div>'; return; }
      const B = 'https://www.gstatic.com/firebasejs/10.12.2';
      const [a, au, fs] = await Promise.all([import(B + '/firebase-app.js'), import(B + '/firebase-auth.js'), import(B + '/firebase-firestore.js')]);
      const app = a.initializeApp(firebaseConfig); DB = createFirestoreDB(fs, fs.getFirestore(app)); AUTH = createFirebaseAuth(au, au.getAuth(app));
    }
  } catch (e) { console.error(e); $('#view').innerHTML = `<div class="login"><div class="lc glass"><h3>Gagal memuat aplikasi</h3><p class="mu">${esc(e.message || e)}</p></div></div>`; return; }
  let first = true;
  AUTH.onChange(async u => {
    if (u) { if (S.role === 'admin') return; S.role = 'admin'; S.user = { email: u.email }; try { await afterAdminLogin(); } catch (e) { console.error(e); S.role = null; renderLogin('Gagal memuat data: ' + (e.message || e)); } }
    else if (S.role === 'admin') { S.role = null; S.user = null; renderLogin(); }
    else if (first && !S.role) renderLogin();
    first = false;
  });
}
boot();
