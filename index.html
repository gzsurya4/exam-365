function createFirestoreDB(fs, db) {

  const enc = d => { const o = {}; for (const k in d) { const v = d[k]; o[k] = v === SERVER ? serverTimestamp() : (TK.includes(k) && typeof v === 'number') ? Timestamp.fromMillis(v) : v; } return o; };

  const all = async q => (await getDocs(q)).docs.map(d => dec(d.id, d.data()));
  const set = (c, id, d) => setDoc(ref(c, id), enc(d), { merge: true });
  const del = (c, id) => deleteDoc(ref(c, id));
  const watch = (c, id, cb) => onSnapshot(ref(c, id), s => cb(s.exists() ? dec(s.id, s.data()) : null), e => console.error(e));

  const bulk = async (ops) => { for (let i = 0; i < ops.length; i += 400) { const b = writeBatch(db); ops.slice(i, i + 400).forEach(f => f(b)); await b.commit(); } };
  return {
    // Data peserta tunggal: siswa/{nis} (publik: nis, nama, kelas) dan akunPeserta/{nis} (salt + hash password, hanya bisa di-get).
    getPeserta: async id => { const [p, a] = await Promise.all([one('siswa', id), one('akunPeserta', id)]); return p ? { ...p, salt: a && a.salt, passHash: a && a.passHash } : null; },
    listPeserta: () => all(collection(db, 'siswa')), savePeserta: (id, d) => savePes(id, d),
    savePesertaMany: a => bulk(a.flatMap(x => { const { salt, passHash, ...p } = x.data; const o = [b => b.set(ref('siswa', x.id), enc({ ...p, nis: x.id }), { merge: true })]; if (salt) o.push(b => b.set(ref('akunPeserta', x.id), { salt, passHash }, { merge: true })); return o; })),
    deletePeserta: async id => { await del('siswa', id); try { await del('akunPeserta', id); } catch { } },
    listUjian: () => all(collection(db, 'ujian')),
    // Hanya ujian AKTIF untuk tingkat siswa (atau SEMUA). Field `lingkup` = tingkat jika aktif, 'NONAKTIF' jika tidak.
    // Query satu field dengan "in" tidak memerlukan composite index.
    listUjianTingkat: t => all(query(collection(db, 'ujian'), where('lingkup', 'in', t ? [t, 'SEMUA'] : ['SEMUA']))),
    saveUjian: (id, d) => set('ujian', id, d),
    getUjianAdmin: id => one('ujian_admin', id), saveUjianAdmin: (id, d) => set('ujian_admin', id, d),
    deleteUjian: async id => { const ops = [b => b.delete(ref('ujian', id)), b => b.delete(ref('ujian_admin', id))]; for (const c of ['sesi', 'nilai', 'pelanggaran']) (await getDocs(byU(c, id))).docs.forEach(d => ops.push(b => b.delete(d.ref))); await bulk(ops); },
    getAkses: h => one('akses', h), saveAkses: (h, d) => set('akses', h, d), deleteAkses: h => del('akses', h),
    getSesi: (u, p) => one('sesi', u + '_' + p), saveSesi: (u, p, d) => set('sesi', u + '_' + p, d), deleteSesi: (u, p) => del('sesi', u + '_' + p),
    listSesi: u => all(byU('sesi', u)), watchSesi: (u, p, cb) => watch('sesi', u + '_' + p, cb),
    saveSesiLogin: async (p, dv) => { await set('sesiLogin', p, { deviceId: dv, waktu: SERVER }); const s = await getDocFromServer(ref('sesiLogin', p)); return s.data().waktu.toMillis(); },
    watchSesiLogin: (p, cb) => watch('sesiLogin', p, cb),
    getNilai: (u, p) => one('nilai', u + '_' + p), listNilai: u => all(byU('nilai', u)), saveNilai: (u, p, d) => set('nilai', u + '_' + p, d),
    saveNilaiMany: a => bulk(a.map(x => b => b.set(ref('nilai', x.ujianId + '_' + x.pesertaId), enc(x), { merge: true }))), deleteNilai: (u, p) => del('nilai', u + '_' + p),
    addPelanggaran: d => setDoc(doc(collection(db, 'pelanggaran')), enc(d)),
    listPelanggaran: async u => (await all(u ? query(collection(db, 'pelanggaran'), where('ujianId', '==', u), limit(500)) : query(collection(db, 'pelanggaran'), orderBy('waktu', 'desc'), limit(300)))).sort((a, b) => b.waktu - a.waktu),
    getPengaturan: async () => ({ ...CFG0, ...((await one('pengaturan', 'umum')) || {}) }), savePengaturan: d => set('pengaturan', 'umum', d),
    getSekolah: async () => (await one('settings', 'sekolah')) || {}, saveSekolah: d => set('settings', 'sekolah', d)

const pad2 = n => String(n).padStart(2, '0');
const dStr = ms => { const d = new Date(ms); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const tStr = ms => { const d = new Date(ms); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
// Kode Pengawas: rahasia bersama untuk membuka dokumen tokenView/{sha256(tv:ujianId:kode)}. Tidak pernah disimpan di dokumen yang bisa dibaca publik.
async function kodePengawas() { if (S.kp === undefined) { const d = await BAP.db.get('pengaturan_admin', 'kode'); S.kp = (d && d.kode) || ''; } return S.kp; }
const tvId = (id, kode) => sha256('tv:' + id + ':' + kode);
const ALF = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
async function tokenAt(seed, i) { const h = await sha256('tk:' + seed + ':' + i); let t = ''; for (let k = 0; k < 6; k++) t += ALF[parseInt(h.substr(k * 2, 2), 16) % ALF.length]; return t; }
const rotMs = () => Math.max(0, +S.cfg.tokenRotasi || 0) * 60000;
function slotsOf(u, rot) {
  if (!rot) return [{ i: 0, dari: u.mulai, sampai: u.selesai }];
  const n = Math.max(1, Math.min(80, Math.ceil((u.selesai - u.mulai) / rot)));
  return Array.from({ length: n }, (_, i) => ({ i, dari: u.mulai + i * rot, sampai: Math.min(u.selesai, u.mulai + (i + 1) * rot + 60000) }));
}
// Token berganti otomatis: seed rahasia + nomor slot waktu -> token. Dokumen akses dibuat per slot dengan jendela waktu (dari/sampai)
// yang ditegakkan oleh Firestore Rules, sehingga token lama benar-benar kedaluwarsa tanpa server.
async function applyToken(u, a0, formUrl, renew) {
  a0 = a0 || {}; const rot = rotMs(), id = u.id;
  const seed = rot ? ((!renew && a0.seed) ? a0.seed : genToken() + genToken()) : '';
  const fixedTok = rot ? '' : ((!renew && a0.token && !a0.seed) ? a0.token : genToken());
  const slots = slotsOf(u, rot), ids = [], tokens = [];
  for (const sl of slots) { const tk = rot ? await tokenAt(seed, sl.i) : fixedTok; tokens.push(tk); ids.push(await sha256(id + ':' + tk)); }
  const old = a0.aksesIds || (a0.token ? [await sha256(id + ':' + a0.token)] : []);
  for (const h of old) if (!ids.includes(h)) { try { await DB.deleteAkses(h); } catch { } }
  for (let k = 0; k < slots.length; k++) await DB.saveAkses(ids[k], rot ? { ujianId: id, formUrl, dari: slots[k].dari, sampai: slots[k].sampai } : { ujianId: id, formUrl });
  const a = { token: tokens[0], formUrl, seed, rot: rot / 60000, aksesIds: ids };
  await DB.saveUjianAdmin(id, a); await syncTokenView(u, a); return a;
}
async function syncTokenView(u, a) { const k = await kodePengawas(); if (!k) return; await BAP.db.set('tokenView', await tvId(u.id, k), { ujianId: u.id, judul: u.judul, rot: a.rot || 0, seed: a.seed || '', token: a.seed ? '' : a.token, mulai: u.mulai, selesai: u.selesai, berlaku: u.selesai + 2 * 3600000 }); }
async function resyncAllTokens() { const uj = await loadUjian(true); let n = 0; for (const u of uj) { const a = await DB.getUjianAdmin(u.id); if (a && a.formUrl) { await applyToken(u, a, a.formUrl, false); n++; } } return n; }
function startTokTick() { clearInterval(S.tkId); tokTick(); S.tkId = setInterval(tokTick, 1000); }
function tokTick() {
  document.querySelectorAll('[data-tk]').forEach(el => {
    const T = (S.tk || {})[el.dataset.tk]; if (!T) return; const n = srv();
    const i = Math.max(0, Math.min(T.tokens.length - 1, Math.floor((n - T.mulai) / T.rot))); el.textContent = T.tokens[i];
    const c = document.querySelector('[data-cd="' + el.dataset.tk + '"]');
    if (c) c.textContent = n > T.selesai ? 'ujian selesai' : n < T.mulai ? 'belum dimulai' : 'berganti dalam ' + mmss((T.mulai + (i + 1) * T.rot - n) / 1000);
  });
}
async function ensureMapel(nama) {
  const list = await BAP.db.list('mapel'), f = list.find(m => m.nama.toLowerCase() === nama.toLowerCase()); if (f) return f;
  const id = await BAP.db.add('mapel', { nama, kode: '' }); BAP.invalidate(); return { id, nama };
}
async function syncJadwal(id, base, ruangIds, ruangMap) {
  const cur = await BAP.db.list('jadwal', [['ujianId', '==', id]]), keep = new Set(ruangIds), blocked = [];
  for (const j of cur) {
    if (keep.has(j.ruangId)) await BAP.db.update('jadwal', j.id, base);
    else if (await BAP.db.get('bap', j.id)) blocked.push(j.ruangNama); else await BAP.db.del('jadwal', j.id);
  }
  const have = new Set(cur.map(j => j.ruangId));
  for (const rid of ruangIds) if (!have.has(rid)) await BAP.db.set('jadwal', id + '_' + rid, { ...base, ruangId: rid, ruangNama: (ruangMap[rid] || {}).nama || '' });
  BAP.invalidate(); return blocked;
}

  return `<details class="rdd"><summary><b>${n} ruang</b><span>${esc(sum)}</span></summary><div class="rchips">${names.map(x => `<span>${esc(x)}</span>`).join('')}</div></details>`;
};

ACT.nImp = () => {
  const w = openModal('Impor Nilai dari Excel / CSV', `<p class="mu">Unggah hasil ekspor Microsoft Forms (<b>Open in Excel</b> &rarr; .xlsx) atau file CSV. Pilih kolom NIS dan kolom skor, lalu impor.</p><input type="file" id="nff" accept=".xlsx,.xls,.csv,.txt"><div id="nio" style="margin-top:12px"></div>`, { wide: true });

    const head = rows[0].map(x => String(x).trim()), data = rows.slice(1);
    const detect = re => head.findIndex(h => re.test(h));
    const iN = detect(/nis|induk|username|npm|nomor peserta|no\.? ?peserta/i), iS = detect(/total points|total poin|skor|nilai|score|points|poin/i);

    let ready = [];

      const a = +$('#cn', w).value, b = +$('#cs', w).value, m = $('#cm', w).value; const sum = $('#csum', w), go = $('#cgo', w);

      for (const r of data) { const id = idFrom(String(r[a]).trim().replace(/\.0+$/, '')), sk = parseFloat(String(r[b]).replace(',', '.')); if (!id || isNaN(sk)) { invalid++; continue; }

      const known = new Set(C.peserta.map(p => p.id)), miss = [...map.keys()].filter(k => !known.has(k));

async function pdfNilai(o) {

  const H = doc.internal.pageSize.getHeight(); if (y + info.length * 5.2 + 8 > H - 20) { doc.addPage(); y = 22; }

const clean = o => { const c = JSON.parse(JSON.stringify(o)); delete c.id; return c; };
const DB = {
  async list(col, fl = []) {
    if (IS_PREVIEW) return Object.entries(MEM[col] || {}).map(([id, d]) => ({ ...clone(d), id })).filter(r => fl.every(([f, , v]) => r[f] === v));
    const { fs, db } = fb;
    const s = await fs.getDocs(fs.query(fs.collection(db, col), ...fl.map(([f, o, v]) => fs.where(f, o, v))));
    return s.docs.map(d => ({ ...d.data(), id: d.id }));
  },
  async get(col, id) {
    if (IS_PREVIEW) { const d = (MEM[col] || {})[id]; return d ? { ...clone(d), id } : null; }
    const { fs, db } = fb; const s = await fs.getDoc(fs.doc(db, col, id));
    return s.exists() ? { ...s.data(), id: s.id } : null;
  },
  async set(col, id, data) {
    const c = clean(data);
    if (IS_PREVIEW) { (MEM[col] = MEM[col] || {})[id] = c; return id; }
    await fb.fs.setDoc(fb.fs.doc(fb.db, col, id), c); return id;
  },
  async add(col, data) {
    const id = IS_PREVIEW ? uid() : fb.fs.doc(fb.fs.collection(fb.db, col)).id;
    return DB.set(col, id, data);
  },
  async update(col, id, data) {
    const c = clean(data);
    if (IS_PREVIEW) { if (MEM[col] && MEM[col][id]) Object.assign(MEM[col][id], c); return; }
    await fb.fs.updateDoc(fb.fs.doc(fb.db, col, id), c);
  },
  async del(col, id) {
    if (IS_PREVIEW) { if (MEM[col]) delete MEM[col][id]; return; }
    await fb.fs.deleteDoc(fb.fs.doc(fb.db, col, id));
  },
  async setMany(col, items) {
    const ids = [];
    if (IS_PREVIEW) { for (const it of items) ids.push(await DB.set(col, it.id || uid(), it.data)); return ids; }
    const { fs, db } = fb;
    for (let i = 0; i < items.length; i += 400) {
      const b = fs.writeBatch(db);
      items.slice(i, i + 400).forEach(it => { const ref = it.id ? fs.doc(db, col, it.id) : fs.doc(fs.collection(db, col)); ids.push(ref.id); b.set(ref, clean(it.data)); });
      await b.commit();
    }
    return ids;
  }
};

async function hashPw(pw, salt) {
  if (IS_PREVIEW) return 'preview:' + pw; // mode uji coba: data hanya di memori, tidak butuh kriptografi (jalan di HTTP maupun HTTPS)
  if (!(window.crypto && crypto.subtle)) throw new Error('Browser tidak mendukung enkripsi. Buka aplikasi lewat HTTPS.');
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: unb64(salt), iterations: 120000 }, k, 256);
  return b64(new Uint8Array(bits));
}
const newSalt = () => (IS_PREVIEW ? 'preview' : b64(crypto.getRandomValues(new Uint8Array(16))));
const USER_RE = /^[a-z0-9._-]{3,60}$/;

async function loginPengawas(username, pw) {
  const id = String(username || '').trim().toLowerCase();
  if (!id || !pw) throw new Error('Isi username dan password.');
  if (!USER_RE.test(id)) throw new Error('Username atau password salah.');
  const acc = await DB.get('akunPengawas', id);
  if (!acc || acc.aktif === false || !acc.salt) throw new Error('Username atau password salah.');
  const h = await hashPw(pw, acc.salt);
  if (h !== acc.hash) throw new Error('Username atau password salah.');
  return { role: 'pengawas', id, pengawasId: acc.pengawasId, nama: acc.nama, nip: acc.nip || '' };
}
const authMsg = e => {
  const c = e && e.code ? e.code : '';
  if (/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)) return 'Email atau password salah.';
  if (/too-many/.test(c)) return 'Terlalu banyak percobaan. Coba lagi beberapa menit lagi.';
  if (/network/.test(c)) return 'Tidak ada koneksi internet.';
  if (/permission-denied/.test(String(e && e.message))) return 'Akses ditolak oleh Security Rules Firestore. Periksa pengaturan rules.';
  return (e && e.message) || 'Terjadi kesalahan.';
};

function absenRows(date) {
  const m = new Map();
  S.data.bap.filter(b => b.tanggal === date).forEach(b => (b.kehadiran || []).forEach(r => {
    if (r.status === 'H') return;
    let x = m.get(r.siswaId);
    if (!x) { x = { siswaId: r.siswaId, nis: r.nis, nama: r.nama, kelas: r.kelas, ruang: b.ruangNama, items: [] }; m.set(r.siswaId, x); }
    x.items.push({ jamKe: b.jamKe, mapel: b.mapelNama, status: r.status, ket: r.ket });
  }));
  const rows = [...m.values()];
  rows.forEach(x => x.items.sort((a, b) => (a.jamKe || 0) - (b.jamKe || 0)));
  rows.sort((a, b) => byName(a.kelas, b.kelas) || byName(a.nama, b.nama));
  return rows;
}

// Parser CSV/TSV sadar tanda kutip: pemisah ; , atau tab (dideteksi dari baris pertama), kutip ganda boleh memuat koma & baris baru.
const splitLines = text => {
  text = String(text || '').replace(/^\uFEFF/, '');
  const first = text.split(/\r?\n/).find(l => l.trim()) || '';
  const outside = first.replace(/"[^"]*"/g, '');
  const d = outside.includes('\t') ? '\t' : outside.includes(';') ? ';' : ',';
  const rows = []; let row = [], f = '', q = false;
  const endRow = () => { row.push(f.trim()); f = ''; if (row.some(x => x)) rows.push(row); row = []; };
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"' && !f.trim()) { q = true; f = ''; }
    else if (c === d) { row.push(f.trim()); f = ''; }
    else if (c === '\n') endRow();
    else if (c !== '\r') f += c;
  }
  endRow();
  return rows;
};
const pidOf = n => String(n ?? '').trim().toLowerCase().replace(/[^a-z0-9._-]/g, '');
const csvl = a => a.map(v => { v = String(v ?? ''); return /[",;\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',');
const dl = (name, text) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\uFEFF' + text], { type: 'text/csv;charset=utf-8' })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); };
async function importSiswa(text) {
  const rows = []; let bad = 0;
  splitLines(text).forEach((l, i) => {
    const p = l;
    if (i === 0 && /^(nis|nomor|no\.?\s*peserta)/i.test(p[0])) return;
    if (p.length < 3 || !p[0] || !p[1] || !p[2]) { bad++; return; }
    rows.push({ nis: p[0], nama: p[1], kelas: p[2] });
  });
  if (!rows.length) throw new Error('Tidak ada baris valid. Format: NIS;Nama;Kelas');
  await ensureSiswa();
  const byNis = new Map(S.data.siswa.map(s => [s.nis, s.id]));
  const kn = new Set(S.data.kelas.map(k => k.nama));
  const newK = [...new Set(rows.map(r => r.kelas))].filter(k => !kn.has(k));
  if (newK.length) {
    const ids = await DB.setMany('kelas', newK.map(n => ({ data: { nama: n } })));
    newK.forEach((n, i) => S.data.kelas.push({ id: ids[i], nama: n }));
  }
  const m = new Map(); rows.forEach(r => m.set(r.nis, r));
  const items = [...m.values()].map(r => ({ id: byNis.get(r.nis) || null, data: r }));
  const ids = await DB.setMany('siswa', items);
  items.forEach((it, i) => upsertLocal('siswa', { ...it.data, id: ids[i] }));
  let kartu = [];
  try { kartu = (await BR.buatPeserta([...m.values()])).kartu; }
  catch (e) { throw new Error('Data siswa tersimpan, tetapi akun peserta ujian online gagal dibuat: ' + (e.message || e)); }
  return { baru: items.filter(i => !i.id).length, ubah: items.filter(i => i.id).length, bad, kartu };
}
async function importPengawas(text) {
  let baru = 0, ubah = 0, bad = 0;
  for (const [i, l] of splitLines(text).entries()) {
    const p = l;
    if (i === 0 && /^nama\b/i.test(p[0])) continue;
    const ex = S.data.pengawas.find(r => r.nama.toLowerCase() === (p[0] || '').toLowerCase());
    const username = ex && ex.username ? ex.username : String(p[2] || '').toLowerCase();
    if (!p[0] || !USER_RE.test(username) || (!(ex && ex.username) && !p[3]) || (p[3] && p[3].length < 6)) { bad++; continue; }
    const acc = await DB.get('akunPengawas', username);
    if (acc && (!ex || acc.pengawasId !== ex.id)) { bad++; continue; }
    let salt = acc ? acc.salt : '', hash = acc ? acc.hash : '';
    if (p[3]) { salt = newSalt(); hash = await hashPw(p[3], salt); }
    const nip = (p[1] || (ex && ex.nip) || '').replace(/\s+/g, '');
    const data = { nama: p[0], nip, username, aktif: ex ? ex.aktif !== false : true, mapelDiampu: p[4] ? p[4].split('|').map(x => x.trim()).filter(Boolean) : ((ex && ex.mapelDiampu) || []) };
    let nid;
    if (ex) { await DB.update('pengawas', ex.id, data); nid = ex.id; ubah++; } else { nid = await DB.add('pengawas', data); baru++; }
    await DB.set('akunPengawas', username, { pengawasId: nid, nama: data.nama, nip, salt, hash, aktif: data.aktif });
    upsertLocal('pengawas', { ...(ex || {}), ...data, id: nid });
  }
  if (!baru && !ubah) throw new Error('Tidak ada baris valid. Format: Nama;NIP;Username;Password');
  return { baru, ubah, bad };
}
async function importRuang(text) {
  let baru = 0, ubah = 0, bad = 0;
  const kn = new Set(S.data.kelas.map(k => k.nama));
  for (const [i, l] of splitLines(text).entries()) {
    const p = l;
    if (i === 0 && /^nama\b/i.test(p[0])) continue;
    if (!p[0]) { bad++; continue; }
    const ex = S.data.ruang.find(r => r.nama.toLowerCase() === p[0].toLowerCase());
    const kb = p[1] ? p[1].split(/[|,]/).map(x => x.trim()).filter(x => kn.has(x)) : (ex ? ex.kelasBawaan || [] : []);
    const data = { nama: p[0], kelasBawaan: kb };
    if (ex) { await DB.update('ruang', ex.id, data); upsertLocal('ruang', { ...ex, ...data }); ubah++; }
    else { const nid = await DB.add('ruang', data); upsertLocal('ruang', { ...data, id: nid }); baru++; }
  }
  if (!baru && !ubah) throw new Error('Tidak ada baris valid. Format: Nama ruang;Kelas bawaan');
  return { baru, ubah, bad };
}

      const mp = S.data.mapel.find(x => x.id === f.mapelId), jamKe = Number(f.jamKe), gids = new Set(grp.map(j => j.id));
      const clash = S.data.jadwal.filter(j => !gids.has(j.id) && j.tanggal === f.tanggal && j.jamKe === jamKe && ids.includes(j.ruangId));
      if (clash.length) throw new Error('Bentrok: ' + clash.slice(0, 5).map(j => j.ruangNama + ' (' + j.mapelNama + ')').join(', ') + (clash.length > 5 ? ', dll' : '') + ' sudah terjadwal pada tanggal dan jam ke-' + jamKe + ' tersebut.');
      const removed = grp.filter(j => !ids.includes(j.ruangId)), blocked = removed.filter(j => S.data.bap.some(b => b.id === j.id));
      if (blocked.length) throw new Error('Ruang ' + blocked.map(j => j.ruangNama).join(', ') + ' sudah memiliki BAP dan tidak bisa dilepas. Hapus BAP-nya di Rekap terlebih dulu.');
      const base = { tanggal: f.tanggal, jamKe, jamMulai: f.jamMulai, jamSelesai: f.jamSelesai, mapelId: mp.id, mapelNama: mp.nama, ujianId: f.ujianId || '', ujianJudul: (ujList.find(x => x.id === f.ujianId) || {}).judul || '' };
      await withLoad(async () => {
        for (const j of removed) { await DB.del('jadwal', j.id); S.data.jadwal = S.data.jadwal.filter(x => x.id !== j.id); }
        const keep = grp.filter(j => ids.includes(j.ruangId));
        for (const j of keep) { await DB.update('jadwal', j.id, base); upsertLocal('jadwal', { ...j, ...base }); }
        const have = new Set(keep.map(j => j.ruangId));
        const add = ids.filter(id => !have.has(id)).map(id => { const rg = S.data.ruang.find(x => x.id === id); return { data: { ...base, ruangId: rg.id, ruangNama: rg.nama } }; });
        const nids = await DB.setMany('jadwal', add);
        add.forEach((a, i) => upsertLocal('jadwal', { ...a.data, id: nids[i] }));
      });
      closeModal(); render(); toast(`Jadwal tersimpan untuk ${ids.length} ruang.`);
    }
  });
}
function deleteJadwal(key) {
  const grp = grpOf(key); if (!grp.length) return;
  if (grp.some(j => S.data.bap.some(b => b.id === j.id))) { toast('Sebagian ruang pada jadwal ini sudah memiliki BAP. Hapus BAP-nya di Rekap terlebih dulu, atau lepas ruang lewat Ubah.', 'err'); return; }
  confirmBox(`Hapus jadwal ${grp[0].mapelNama} untuk ${grp.length} ruang?`, async () => {
    await withLoad(async () => { for (const j of grp) await DB.del('jadwal', j.id); });
    const ids = new Set(grp.map(j => j.id)); S.data.jadwal = S.data.jadwal.filter(j => !ids.has(j.id)); render(); toast('Jadwal dihapus.');
  }, 'Hapus');
}

  const cxL = mL + cw * 0.25, cxR = mL + cw * 0.75, ctr = { align: 'center' };

    doc.setFont('times', 'bold');

    doc.setFont('times', 'normal'); if (nip) doc.text('NIP. ' + nip, x, yy + 5, ctr);
  };
  const dateline = `${st.kota ? st.kota + ', ' : ''}${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`;
  doc.setFont('times', 'normal');
  doc.text(dateline, cxR, y, ctr); y += 6;

    signName(b.pengawasNama, b.pengawasNip, cxL, y, b.ttd); signName(b.pengawas2, b.pengawas2Nip, cxR, y, b.ttd2);
    y += 16; doc.text('Mengetahui,', W / 2, y, ctr); y += 5.5; doc.text('Kepala Sekolah', W / 2, y, ctr); y += 22;
    signName(st.kepsek, st.nipKepsek, W / 2, y);
  } else {
    doc.text('Mengetahui,', cxL, y, ctr); doc.text('Pengawas', cxR, y, ctr); y += 5.5;
    doc.text('Kepala Sekolah', cxL, y, ctr); y += 22;
